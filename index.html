a{color:inherit;text-underline-offset:3px}
button,input,textarea{font:inherit;color:inherit}

.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{padding:44px 0 8px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}

.notice i{width:10px;height:10px;border-radius:50%;background:var(--close);flex:none}
.btn{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:34px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:2.6rem;font-weight:800;line-height:1}
.stat.hi{background:var(--close);border-color:var(--close);color:var(--close-ink)}
.stat span{display:block;margin-top:8px;font-size:.95rem}
section.band{padding:60px 0 0}
section.band h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;max-width:26ch}
p.sub{color:var(--muted);max-width:66ch;margin:12px 0 0}
.groups{display:grid;grid-template-columns:1fr;gap:18px;margin-top:24px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.group h3{font-size:1.15rem;margin-bottom:10px}
.group h3 small{font-family:"Public Sans",sans-serif;font-weight:400;color:var(--muted);font-size:.9rem}
.group ul{list-style:none;margin:0;padding:0;column-width:210px;column-gap:28px}
.group li{padding:3px 0;border-bottom:1px solid var(--line);font-size:.95rem;break-inside:avoid}
.group li:last-child{border-bottom:0}
.group li.chain{color:var(--muted)}
.note{color:var(--muted);font-size:.88rem;margin-top:12px}
.rank{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 20px}
.rrow{display:grid;grid-template-columns:minmax(8em,12em) 1fr;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow.me .rname{font-weight:800}
.rname{font-weight:600}
.rtrack{height:28px;display:flex;align-items:center;gap:10px}
.rfill{height:100%;background:var(--line);border-radius:5px}
.rrow.me .rfill{background:var(--close)}
.rval{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.92rem}
.rrow.zero .rval{color:var(--muted)}
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:24px}
blockquote{margin:0;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--close);border-radius:0 12px 12px 0;padding:20px}

blockquote footer{margin-top:10px;color:var(--muted);font-size:.9rem}

.cta{margin-top:24px;background:var(--ink);color:var(--bg);border-radius:16px;padding:30px;font-size:1.15rem;max-width:760px;white-space:pre-line}
details{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
summary{cursor:pointer;padding:16px 20px;font-weight:600}
.tablebox{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.95rem}
th,td{text-align:left;padding:9px 16px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.86rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

.editor .row{display:grid;gap:6px;margin:14px 0}
.editor label{font-weight:600;font-size:.9rem}
.editor input,.editor textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}

.editor .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.editor .bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;position:sticky;bottom:0;background:var(--surface);padding:10px 0}

<script id="app">
(function(){
'use strict';
var SRC = { css: document.getElementById('s').textContent, js: document.getElementById('app').textContent };
var state = JSON.parse(document.getElementById('data').textContent);
var root = document.getElementById('root');
var editing = false, draft = null, canEdit = false, artifactNs = null, editMsg = '';
var CAT = { food: 'Food and drink', retail: 'Shops and makers', services: 'Services', community: 'Community organizations' };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ return (v === null || v === undefined || v === '' || isNaN(+v)) ? null : +v; }
function closing(s){ return (s.scenarios || []).length > 0; }
function rankOf(x, pool){
  var b = num(x.businesses);
  return { rank: 1 + pool.filter(function(s){ return num(s.businesses) > b; }).length,
           above: pool.filter(function(s){ return num(s.businesses) > b; }),
           ties: pool.filter(function(s){ return s.id !== x.id && num(s.businesses) === b; }), n: pool.length };
}

function statsHtml(){
  var jj = state.schools.filter(function(s){ return s.id === 'james-john'; })[0];
  if (!jj) return '';
  var counted = state.schools.filter(function(s){ return num(s.businesses) != null; });
  var cl = counted.filter(closing);
  var rc = rankOf(jj, counted), rl = rankOf(jj, cl);
  var b = num(jj.businesses), ind = num(jj.independent);
  var h = '<div class="stats">';
  if (num(state.jjBlock) != null) h += '<div class="stat hi"><b>' + num(state.jjBlock) + '</b><span>businesses within about two blocks of the school</span></div>';
  h += '<div class="stat"><b>' + b + '</b><span>businesses within a five-minute walk</span></div>';
  if (ind != null) h += '<div class="stat"><b>' + Math.round(ind / b * 100) + '%</b><span>of them locally owned</span></div>';
  h += '<div class="stat"><b>#' + rl.rank + '</b><span>of the ' + cl.length + ' schools proposed to close, for nearby businesses</span></div>';
  h += '<div class="stat"><b>#' + rc.rank + '</b><span>of all ' + rc.n + ' PPS schools we counted' + (rc.above.length ? ', behind only ' + esc(rc.above.map(function(s){ return s.name; }).join(', ')) : '') + (rc.ties.length ? ' (tied with ' + esc(rc.ties.map(function(s){ return s.name; }).join(', ')) + ')' : '') + '</span></div>';
  if (num(state.surveyed)) h += '<div class="stat"><b>' + (num(state.expectLoss) || 0) + ' of ' + num(state.surveyed) + '</b><span>business owners surveyed expect to lose sales if the school closes</span></div>';
  return h + '</div>';
}

function businessesHtml(){
  var L = state.businesses || [];
  if (!L.length) return '';
  var h = '<section class="band"><div class="wrap"><h2>The ' + L.length + ' businesses and organizations that make up St.&nbsp;Johns</h2><p class="sub">The shops, restaurants, services, and community groups of St. Johns, many of them steps from James John School. Chains and regional companies are shown in gray.</p><div class="groups">';
  ['food','retail','services','community'].forEach(function(c){
    var g = L.filter(function(b){ return b.c === c; });
    if (!g.length) return;
    h += '<div class="group"><h3>' + CAT[c] + ' <small>' + g.length + '</small></h3><ul>' +
      g.map(function(b){ return '<li' + (b.l ? '' : ' class="chain"') + '>' + esc(b.n) + '</li>'; }).join('') + '</ul></div>';
  });
  h += '</div><p class="note">' + esc(state.bizSourceNote || '') + '</p></div></section>';
  return h;
}

function rankHtml(){
  var cl = state.schools.filter(function(s){ return closing(s) && num(s.businesses) != null; })
    .sort(function(a, b){ return num(b.businesses) - num(a.businesses); });
  if (!cl.length) return '';
  var max = num(cl[0].businesses) || 1;
  var h = '<section class="band"><div class="wrap"><h2>No other school on the list is part of its business district like this</h2><p class="sub">Businesses within a five-minute walk of each school PPS has proposed to close.</p><div class="rank">';
  cl.forEach(function(s){
    var b = num(s.businesses);
    h += '<div class="rrow' + (s.id === 'james-john' ? ' me' : '') + (b ? '' : ' zero') + '"><span class="rname">' + esc(s.name) + '</span><span class="rtrack"><span class="rfill" style="width:' + (b ? Math.max(1, b / max * 65) : 0) + '%"></span><span class="rval">' + (b ? b + ' businesses' : 'None nearby') + '</span></span></div>';
  });
  h += '</div>';
  if (state.compareNote) h += '<p class="sub" style="margin-top:18px;color:var(--ink)">' + esc(state.compareNote) + '</p>';
  return h + '</div></section>';
}

function paras(t){ return String(t || '').split(/\n\s*\n/).filter(function(x){ return x.trim(); }).map(function(x){ return '<p>' + esc(x.trim()) + '</p>'; }).join(''); }
function zLabel(z){
  var parts = String(z || '').split('/').map(function(c){
    if (/^CM/.test(c)) return 'commercial mixed use';
    if (/^RM|^RX/.test(c)) return 'multi-dwelling residential';
    if (/^R\d/.test(c)) return 'single-dwelling residential';
    if (c === 'OS') return 'open space';
    return c;
  });
  var s = parts.join(', ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function saleNote(s){
  var z = String(s.zoning || ''), n = [];
  if (s.owner) n.push('Shared condominium ownership; the district can\u2019t sell the site on its own');
  if (z === 'OS') n.push('Entirely open space: no housing or commercial development without a city rezoning');
  else {
    if (/(^|\/)OS/.test(z)) n.push('Partly open space');
    if (/(^|\/)CM/.test(z)) n.push('Zoned for commercial and housing development');
    else if (/(^|\/)(RM|RX)/.test(z)) n.push('Zoned for apartments');
    else if (/(^|\/)R\d/.test(z)) n.push('Zoned for housing');
  }
  if (s.tenant) n.push(s.tenant);
  return n.join('. ') + '.';
}
function hard(s){ return !!s.owner || /(^|\/)OS/.test(String(s.zoning || '')); }
function jjZoningHtml(){
  var jj = state.schools.filter(function(s){ return s.id === 'james-john'; })[0];
  if (!jj || !jj.zoning || !state.jjZoningTitle) return '';
  var h = '<section class="band"><div class="wrap"><div class="jjz"><div class="jjz-text"><h2>' + esc(state.jjZoningTitle) + '</h2><div class="prose">' + paras(state.jjZoningText) + '</div></div>';
  h += '<div class="jjz-card"><span class="zk">Zoning</span><span class="zv">' + esc(jj.zoning) + '</span><span class="zd">' + esc(zLabel(jj.zoning)) + '</span>';
  h += '<span class="zk">Owner</span><span class="zd2">' + esc(jj.owner || 'Portland Public Schools') + '</span>';
  var others = state.schools.filter(function(s){ return closing(s) && s.id !== 'james-john' && s.zoning; });
  var com = others.filter(function(s){ return /(^|\/)(CM|CE|CX)/.test(s.zoning); }).length;
  h += '<span class="zk">Other closing schools with commercial zoning</span><span class="zv">' + com + ' of ' + others.length + '</span></div></div></div></section>';
  return h;
}
function allZoningHtml(){
  var L = state.schools.filter(function(s){ return s.zoning && s.id !== 'james-john'; });
  if (!L.length) return '';
  var cl = L.filter(closing).sort(function(a, b){ return a.name.localeCompare(b.name); });
  var op = L.filter(function(s){ return !closing(s); }).sort(function(a, b){ return (hard(b) ? 1 : 0) - (hard(a) ? 1 : 0) || a.name.localeCompare(b.name); });
  function rows(list){ return list.map(function(s){ return '<tr' + (hard(s) ? ' class="hard"' : '') + '><td><strong>' + esc(s.name) + '</strong></td><td><span class="zc">' + esc(s.zoning) + '</span><br><small>' + esc(zLabel(s.zoning)) + '</small></td><td>' + esc(s.owner || 'Portland Public Schools') + '</td><td>' + esc(saleNote(s)) + '</td></tr>'; }).join(''); }
  var h = '<section class="band"><div class="wrap"><h2>' + esc(state.allZoningTitle) + '</h2><div class="prose" style="max-width:70ch;margin-top:12px">' + paras(state.allZoningText) + '</div>';
  h += '<div class="tablebox zt"><table><thead><tr><th>School</th><th>Zoning</th><th>Owner</th><th>What it means for the site</th></tr></thead><tbody>';
  if (op.length) h += '<tr class="grp"><td colspan="4">Staying open, receiving students from closing schools</td></tr>' + rows(op);
  if (cl.length) h += '<tr class="grp"><td colspan="4">Proposed to close</td></tr>' + rows(cl);
  h += '</tbody></table></div>';
  if (state.allZoningNote) h += '<p class="note">' + esc(state.allZoningNote) + '</p>';
  return h + '</div></section>';
}

function researchHtml(){
  var R = state.research || [];
  if (!R.length) return '';
  var h = '<section class="band"><div class="wrap"><h2>' + esc(state.researchTitle) + '</h2>' + (state.researchIntro ? '<p class="sub">' + esc(state.researchIntro) + '</p>' : '') + '<div class="rgrid">';
  R.forEach(function(r){
    h += '<div class="rcard"><h3>' + esc(r.h) + '</h3><p>' + esc(r.t) + '</p><p class="rsrc">' + (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.src) + '</a>' : esc(r.src)) + '</p></div>';
  });
  h += '</div>' + (state.researchNote ? '<p class="note">' + esc(state.researchNote) + '</p>' : '') + '</div></section>';
  return h;
}

function questionsHtml(){
  var Q = String(state.questions || '').split('\n').map(function(q){ return q.trim(); }).filter(Boolean);
  if (!Q.length) return '';
  return '<section class="band"><div class="wrap"><h2>' + esc(state.questionsTitle) + '</h2>' + (state.questionsIntro ? '<p class="sub">' + esc(state.questionsIntro) + '</p>' : '') +
    '<ol class="qlist">' + Q.map(function(q){ return '<li>' + esc(q) + '</li>'; }).join('') + '</ol></div></section>';
}

function actionsHtml(){
  var h = '';
  var A = state.actions || [];
  if (A.length) h += '<div class="agrid">' + A.map(function(a){ return '<div class="acard"><h3>' + esc(a.t) + '</h3><p>' + esc(a.d) + '</p><a class="btn primary" href="' + esc(a.url) + '"' + (/^mailto:/.test(a.url) ? '' : ' target="_blank" rel="noopener"') + '>' + esc(a.label) + '</a></div>'; }).join('') + '</div>';
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var E = (state.events || []).filter(function(e){ var d = new Date(e.date + 'T23:59:59'); return !(d < today); });
  if (E.length) h += '<h3 class="evh">Show up</h3><ul class="evlist">' + E.map(function(e){ return '<li><span class="evwhen">' + esc(e.when) + '</span><strong>' + esc(e.title) + '</strong><span>' + esc(e.where) + '</span>' + (e.note ? '<em>' + esc(e.note) + '</em>' : '') + '</li>'; }).join('') + '</ul>';
  var L = state.learnLinks || [];
  if (L.length) h += '<h3 class="evh">Stay informed</h3><ul class="llist">' + L.map(function(l){ return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a></li>'; }).join('') + '</ul>';
  return h;
}

function voicesHtml(){
  var q = (state.quotes || []).filter(function(x){ return x.q; });
  var h = '<section class="band"><div class="wrap"><h2>What St. Johns business owners say</h2>';
  if (!q.length) h += '<div class="placeholder">' + esc(state.quotesIntro) + '</div>';
  else h += '<div class="voices">' + q.map(function(x){ return '<blockquote><p>\u201c' + esc(x.q) + '\u201d</p>' + (x.who ? '<footer>' + esc(x.who) + '</footer>' : '') + '</blockquote>'; }).join('') + '</div>';
  if (state.surveyUrl) h += '<div class="survey"><p>' + esc(state.surveyText) + '</p><a class="btn primary" href="' + esc(state.surveyUrl) + '" target="_blank" rel="noopener">Take the survey</a></div>';
  return h + '</div></section>';
}

function tableHtml(){
  var L = state.schools.filter(function(s){ return num(s.businesses) != null; }).sort(function(a, b){ return num(b.businesses) - num(a.businesses) || a.name.localeCompare(b.name); });
  var h = '<details><summary>See the counts for all ' + L.length + ' schools</summary><div class="tablebox"><table><thead><tr><th>School</th><th>Proposed to close?</th><th class="n">Businesses within a 5-minute walk</th></tr></thead><tbody>';
  L.forEach(function(s){ h += '<tr' + (s.id === 'james-john' ? ' class="me"' : '') + '><td>' + esc(s.name) + '</td><td>' + (closing(s) ? 'Yes' : '') + '</td><td class="n">' + num(s.businesses) + '</td></tr>'; });
  return h + '</tbody></table></div></details>';
}

function editorHtml(){
  var d = draft;
  function ta(k, label){ return '<div class="row"><label for="e-' + k + '">' + label + '</label><textarea id="e-' + k + '" data-k="' + k + '">' + esc(d[k]) + '</textarea></div>'; }
  var quotes = (d.quotes || []).map(function(x){ return x.q + (x.who ? '\n\u2014 ' + x.who : ''); }).join('\n\n');
  var h = '<div class="editor"><h2 style="font-size:1.5rem">Edit page</h2><p class="msg">Only you can see this panel. Changes go live when you publish.</p>';
  h += '<div class="row"><label for="e-title">Headline</label><input id="e-title" data-k="title" value="' + esc(d.title) + '"></div>';
  h += ta('subtitle', 'Subheadline') + ta('intro', 'Introduction') + ta('notice', 'Status note') + ta('heroCaption', 'Photo caption (include photo credit if needed)') + ta('compareNote', 'Note under the closing-schools list') + ta('jjZoningTitle', 'James John zoning: headline') + ta('jjZoningText', 'James John zoning: text') + ta('allZoningTitle', 'Other schools zoning: headline') + ta('allZoningText', 'Other schools zoning: text') + ta('allZoningNote', 'Other schools zoning: note under table');
  h += '<div class="row"><label for="e-quotes">Business owner quotes (blank line between quotes; put the name on its own line starting with \u2014)</label><textarea id="e-quotes" data-quotes style="min-height:140px">' + esc(quotes) + '</textarea></div>';
  h += '<div class="two"><div class="row"><label for="e-sv">Owners surveyed</label><input id="e-sv" type="number" data-n="surveyed" value="' + esc(d.surveyed == null ? '' : d.surveyed) + '"></div><div class="row"><label for="e-el">Of those, expect to lose sales</label><input id="e-el" type="number" data-n="expectLoss" value="' + esc(d.expectLoss == null ? '' : d.expectLoss) + '"></div></div>';
  h += ta('quotesIntro', 'Text shown before any quotes are added') + ta('surveyText', 'Survey invitation text') + '<div class="row"><label for="e-surl">Survey link</label><input id="e-surl" data-k="surveyUrl" value="' + esc(d.surveyUrl) + '"></div>' + ta('questionsTitle', 'Questions: headline') + ta('questionsIntro', 'Questions: intro') + ta('questions', 'Questions (one per line)') + ta('ctaQuote', 'Quote above What you can do') + ta('ctaQuoteBy', 'Quote attribution') + ta('cta', 'What you can do: intro') + ta('method', 'How the numbers were gathered') + ta('about', 'About this page') + '<div class="row"><label for="e-ce">Contact email</label><input id="e-ce" data-k="contactEmail" value="' + esc(d.contactEmail) + '"></div>';
  h += '<div class="bar2"><button class="btn primary" data-act="publish">Publish changes</button><button class="btn" data-act="cancel">Discard changes</button><span class="msg" id="edmsg">' + esc(editMsg) + '</span></div></div>';
  return h;
}

function render(){
  var y = window.scrollY;
  var hasImg = !!state.heroImage;
  var h = '<header class="top"><div class="wrap">' + (state.altLangUrl ? '<a class="langlink" href="' + esc(state.altLangUrl) + '" lang="' + (state.lang === 'es' ? 'en' : 'es') + '">' + esc(state.altLangLabel) + '</a>' : '') + '<div class="herogrid' + (hasImg ? '' : ' nophoto') + '" id="herogrid"><div class="herotext"><div class="toprow"><h1>' + esc(state.title).replace(/St\. /g, 'St.&nbsp;') + '</h1>';
  if (canEdit) h += '<button class="btn" data-act="edit">' + (editing ? 'Close editor' : 'Edit page') + '</button>';
  h += '</div>' + (state.subtitle ? '<p class="subhead">' + esc(state.subtitle) + '</p>' : '');
  h += '</div>';
  if (hasImg) h += '<figure class="hero" id="hero"><img src="' + esc(state.heroImage) + '" alt="' + esc(state.heroAlt) + '" width="1100" height="1159">' + (state.heroCaption ? '<figcaption>' + esc(state.heroCaption) + '</figcaption>' : '') + '</figure>';
  h += '</div><div class="introgrid' + (state.notice ? '' : ' nonote') + '"><p class="lede">' + esc(state.intro) + '</p>' + (state.notice ? '<p class="notice"><i aria-hidden="true"></i><span>' + esc(state.notice) + '</span></p>' : '') + '</div>';
  if (editing && draft) h += editorHtml();
  h += statsHtml() + '</div></header><main>';
  setTimeout(function(){ var im = document.querySelector('#hero img'); if (im) { var hide = function(){ var f = document.getElementById('hero'), g = document.getElementById('herogrid'); if (f) f.style.display = 'none'; if (g) g.classList.add('nophoto'); }; if (im.complete && !im.naturalWidth) hide(); else im.addEventListener('error', hide); } }, 0);
  h += businessesHtml() + rankHtml() + researchHtml() + jjZoningHtml() + allZoningHtml() + voicesHtml();
  h += questionsHtml();
  if (state.cta) h += '<section class="band"><div class="wrap"><h2>What you can do</h2>' + (state.ctaQuote ? '<blockquote class="ctaq"><p>\u201c' + esc(state.ctaQuote) + '\u201d</p>' + (state.ctaQuoteBy ? '<footer>' + esc(state.ctaQuoteBy) + '</footer>' : '') + '</blockquote>' : '') + '<p class="sub" style="color:var(--ink);font-size:1.1rem">' + esc(state.cta) + '</p>' + actionsHtml() + '</div></section>';
  h += '</main><footer class="page"><div class="wrap"><h2 style="font-size:1.3rem;color:var(--ink)">How these numbers were gathered</h2><p class="method">' + esc(state.method) + '</p>' + tableHtml();
  if (state.updated) h += '<p style="margin-top:24px">Last updated ' + esc(state.updated) + '.</p>';
  if (state.sources && state.sources.length) h += '<p>Sources</p><ul>' + state.sources.map(function(s){ return '<li>' + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>' : esc(s.label)) + '</li>'; }).join('') + '</ul>';
  if (state.about || state.contactEmail) h += '<div class="about">' + (state.about ? '<p><strong>About this page.</strong> ' + esc(state.about) + '</p>' : '') + (state.contactEmail ? '<p>Questions, corrections, or want to help? Email <a href="mailto:' + esc(state.contactEmail) + '">' + esc(state.contactEmail) + '</a>.</p>' : '') + '</div>';
  h += '</div></footer>';
  root.innerHTML = h;
  window.scrollTo(0, y);
}

root.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (t) act(t.getAttribute('data-act'), t);
});
root.addEventListener('input', function(e){
  var t = e.target; if (!draft) return;
  if (t.hasAttribute('data-k')) draft[t.getAttribute('data-k')] = t.value;
  if (t.hasAttribute('data-n')) draft[t.getAttribute('data-n')] = t.value === '' ? null : +t.value;
  if (t.hasAttribute('data-quotes')) {
    draft.quotes = t.value.split(/\n\s*\n/).map(function(block){
      var lines = block.trim().split('\n'), who = '';
      if (lines.length > 1 && /^\s*[\u2014\-]/.test(lines[lines.length - 1])) who = lines.pop().replace(/^\s*[\u2014\-]+\s*/, '');
      return { q: lines.join(' ').trim().replace(/^["\u201c]|["\u201d]$/g, ''), who: who };
    }).filter(function(x){ return x.q; });
  }
});

async function act(a, el){
  if (a === 'edit') { editing = !editing; draft = editing ? JSON.parse(JSON.stringify(state)) : null; editMsg = ''; render(); return; }
  if (a === 'cancel') { editing = false; draft = null; render(); return; }
  if (a === 'publish') {
    draft.updated = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    el.disabled = true; setMsg('Publishing\u2026');
    try { await artifactNs.publish(buildHtml(draft)); setMsg('Published. Reloading\u2026'); }
    catch (err) {
      el.disabled = false; var c = err && err.code;
      if (c === 'conflict') setMsg('A newer version was saved elsewhere; the page is reloading to it, so these edits were not saved.');
      else if (c === 'rate_limited') setMsg('Publishing too often. Wait a minute, then try again.');
      else if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'capability_disabled' || c === 'not_declared') setMsg('This view is read-only, so changes can\u2019t be published from here.');
      else setMsg('Publishing failed (' + (c || 'unknown error') + '). Your edits are still here; try again.');
    }
  }
}
function setMsg(m){ editMsg = m; var n = document.getElementById('edmsg'); if (n) n.textContent = m; }

function buildHtml(st){
  var json = JSON.stringify(st, null, 1).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="' + (st.lang || 'en') + '">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    '<title>' + esc(st.title) + '</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">\n' +
    '<style id="s">' + SRC.css + '</style>\n</head>\n<body>\n<div id="root"></div>\n' +
    '<script type="application/json" id="data">' + json + '<\/script>\n' +
    '<script id="app">' + SRC.js + '<\/script>\n</body>\n</html>\n';
}

render();

})();
</script>
</body>
</html>
