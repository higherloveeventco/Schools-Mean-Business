<style id="s">
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#14213D; --muted:#55627A; --line:#D5DBE3;
  --close:#E9A300; --close-ink:#3D2A00; --open:#2A7F7A; --unl:#FFFFFF; --water:#CADCEA; --land:#E9EDF2;
  --focus:#1D5FD1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1625; --surface:#162135; --ink:#E7ECF4; --muted:#9BA9BF; --line:#2A3852;
    --close:#F2B705; --close-ink:#2A1D00; --open:#4DB3AC; --unl:#162135; --water:#1B3350; --land:#121C2E; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1625; --surface:#162135; --ink:#E7ECF4; --muted:#9BA9BF; --line:#2A3852;
  --close:#F2B705; --close-ink:#2A1D00; --open:#4DB3AC; --unl:#162135; --water:#1B3350; --land:#121C2E; --focus:#7FB0FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{padding:40px 0 24px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(2.1rem,5.4vw,3.9rem);font-weight:800;max-width:15ch;letter-spacing:-.015em}
.lede{max-width:62ch;color:var(--muted);font-size:1.12rem;margin:18px 0 0}
.notice{display:inline-flex;gap:10px;align-items:center;margin-top:22px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.95rem}
.notice i{width:10px;height:10px;border-radius:50%;background:var(--close);flex:none}
.btn{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:12px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.dot{cursor:pointer}
.dot circle.p{stroke:var(--ink);stroke-width:2}
.dot.closing circle.p{fill:var(--close)}
.dot.open circle.p{fill:var(--open)}
.dot.unlisted circle.p{fill:var(--unl)}
.dot circle.ring{fill:none;stroke:var(--ink);stroke-width:2.5;opacity:0}
.dot.sel circle.ring{opacity:1}
.dot:focus{outline:none}
.dot:focus-visible circle.ring{opacity:1;stroke:var(--focus)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);padding:8px 6px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.sw.closing{background:var(--close)}.sw.open{background:var(--open)}.sw.unlisted{background:var(--unl)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.detail h2{font-size:1.9rem;font-weight:700}
.chip{display:inline-block;font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-top:10px}
.chip.closing{background:var(--close);color:var(--close-ink)}
.chip.open{background:var(--open);color:#fff}
.chip.unlisted{border:1px solid var(--line);color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin:22px 0 0}
.fact b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.7rem;font-weight:700;line-height:1.1}
.fact small{color:var(--muted);font-size:.86rem}
.story{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-style:italic}
.empty{color:var(--muted)}
section.band{padding:56px 0 8px}
section.band h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;max-width:24ch}
section.band > .wrap > p.sub{color:var(--muted);max-width:64ch;margin:10px 0 0}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:26px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.metric h3{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.bar{display:grid;grid-template-columns:8.5em 1fr;gap:10px;align-items:center;margin:8px 0;font-size:.92rem}
.bar .track{height:30px;background:var(--land);border-radius:6px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:6px}
.bar .fill.closing{background:var(--close)}.bar .fill.open{background:var(--open)}
.bar .val{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-weight:700;font-size:.9rem}
.metric .cov{color:var(--muted);font-size:.82rem;margin-top:10px}
.placeholder{margin-top:26px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;max-width:62ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.92rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.86rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--land)}
tbody tr:last-child td{border-bottom:0}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;margin-top:22px}
.method h3{font-size:1.1rem;margin-bottom:6px}
.method p{margin:0;color:var(--muted);white-space:pre-line}
footer{padding:48px 0 56px;color:var(--muted);font-size:.9rem}
footer ul{padding-left:1.1em;margin:8px 0 0}
.editor{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:22px;margin-top:20px}
.editor h2{font-size:1.5rem}
.editor .row{display:grid;gap:6px;margin:14px 0}
.editor label{font-weight:600;font-size:.9rem}
.editor input,.editor select,.editor textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.editor textarea{min-height:70px}
.editor table{min-width:1700px;font-size:.88rem}
.editor td{padding:5px 6px;vertical-align:top}
.editor td input{min-width:70px}
.editor .bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;position:sticky;bottom:0;background:var(--surface);padding:10px 0}
.msg{font-size:.92rem;color:var(--muted)}
.rank{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 20px}
.rrow{display:grid;grid-template-columns:minmax(8em,13em) 1fr;gap:14px;align-items:center;padding:7px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.rrow:last-child{border-bottom:0}
.rrow:hover .rname{text-decoration:underline}
.rname{font-weight:600}
.rtrack{position:relative;height:30px;display:flex;align-items:center;gap:10px}
.rfill{height:100%;background:var(--close);border-radius:5px}
.rval{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.92rem}
.rval b{font-size:1.05rem}
.rrow.zero .rval{color:var(--muted)}
.rnote{color:var(--muted);font-size:.86rem;margin:12px 0 4px}
@media (max-width:560px){.rrow{grid-template-columns:1fr;gap:4px}}
.spot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.spot .body p{margin:0 0 14px;max-width:62ch}
.spot .facts{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.ask{margin-top:6px;padding:18px 20px;border-left:5px solid var(--close);background:var(--surface);border-radius:0 10px 10px 0;font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem;font-weight:700;line-height:1.3;max-width:58ch}
@media (max-width:860px){.spot{grid-template-columns:1fr}}
@media (max-width:860px){.mapgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.detail{transition:border-color .2s}}
</style>

<script id="app">
(function(){

if (!Array.isArray(state.schools)) state.schools = [];

var root = document.getElementById('root');
var scen = 'A';
var selected = null, filter = 'all', editing = false, canEdit = false, artifactNs = null, draft = null, editMsg = '';
var LABEL = { closing: 'Proposed to close', open: 'Staying open', unlisted: 'Not yet announced' };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ if (v === null || v === undefined || v === '' || isNaN(+v)) return null; return +v; }
function money(v){ v = num(v); if (v == null) return null; if (v >= 1e6) return '$' + (v/1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M'; if (v >= 1e3) return '$' + Math.round(v/1e3) + 'K'; return '$' + Math.round(v); }
function stat(x){ if (state.released) return (x.scenarios || []).indexOf(scen) >= 0 ? 'closing' : 'open'; return LABEL[x.status] ? x.status : 'unlisted'; }
function scenText(x){ var s = x.scenarios || []; if (s.length === 2) return 'Both scenarios'; if (s.length === 1) return 'Scenario ' + s[0] + ' only'; return 'Neither scenario'; }
function scenCount(k){ return state.schools.filter(function(x){ return (x.scenarios || []).indexOf(k) >= 0; }).length; }
function byId(id){ for (var i = 0; i < state.schools.length; i++) if (state.schools[i].id === id) return state.schools[i]; return null; }

/* ---------- map ---------- */
var B = { n: 45.65, s: 45.43, w: -122.85, e: -122.55 };
var MW = 1000, MH = Math.round(1000 * (B.n - B.s) * 111 / ((B.e - B.w) * 78.6));
function px(lat, lon){ return [ (lon - B.w) / (B.e - B.w) * MW, (B.n - lat) / (B.n - B.s) * MH ]; }
function path(pts){ return pts.map(function(p, i){ var q = px(p[0], p[1]); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(' '); }
var WILLAMETTE = [[45.43,-122.652],[45.45,-122.655],[45.47,-122.662],[45.49,-122.666],[45.505,-122.668],[45.52,-122.671],[45.535,-122.672],[45.55,-122.682],[45.562,-122.698],[45.572,-122.72],[45.582,-122.748],[45.59,-122.765],[45.605,-122.775],[45.625,-122.775],[45.648,-122.763]];
var COLUMBIA = [[45.66,-122.80],[45.648,-122.763],[45.628,-122.72],[45.618,-122.68],[45.607,-122.63],[45.597,-122.58],[45.588,-122.55]];

function mapSvg(){
  var s = '<svg viewBox="0 0 ' + MW + ' ' + MH + '" role="img" aria-label="Schematic map of Portland Public Schools elementary and K-8 schools">';
  s += '<rect width="' + MW + '" height="' + MH + '" fill="var(--land)" rx="8"/>';
  s += '<path d="' + path(COLUMBIA) + '" fill="none" stroke="var(--water)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>';
  s += '<path d="' + path(WILLAMETTE) + '" fill="none" stroke="var(--water)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>';
  var lbl = px(45.497, -122.676);
  s += '<text x="' + lbl[0] + '" y="' + lbl[1] + '" fill="var(--muted)" font-size="18" font-style="italic" transform="rotate(-80 ' + lbl[0] + ' ' + lbl[1] + ')" text-anchor="middle">Willamette</text>';
  var c = px(45.612, -122.60);
  s += '<text x="' + c[0] + '" y="' + (c[1] - 24) + '" fill="var(--muted)" font-size="18" font-style="italic" text-anchor="middle" transform="rotate(10 ' + c[0] + ' ' + (c[1] - 24) + ')">Columbia</text>';
  var order = { unlisted: 0, open: 1, closing: 2 };
  var list = state.schools.filter(function(x){ return num(x.lat) != null && num(x.lon) != null; })
    .sort(function(a, b){ return (order[stat(a)] || 0) - (order[stat(b)] || 0); });
  list.forEach(function(x){
    var p = px(+x.lat, +x.lon), st = stat(x);
    s += '<g class="dot ' + st + (selected === x.id ? ' sel' : '') + '" data-id="' + esc(x.id) + '" tabindex="0" role="button" aria-label="' + esc(x.name) + ', ' + LABEL[st] + '">';
    s += '<title>' + esc(x.name) + '</title>';
    s += '<circle class="ring" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="17"/>';
    s += '<circle class="p" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (st === 'closing' ? 11 : 8.5) + '"/>';
    s += '</g>';
  });
  return s + '</svg>';
}

function detailHtml(){
  var x = selected && byId(selected);
  if (!x) {
    return '<div class="detail"><h2>Pick a school</h2><p class="empty">Select any dot on the map, or a row in the table below, to see the businesses around that school and the value of its land.</p></div>';
  }
  var st = stat(x);
  var biz = num(x.businesses);
  var h = '<div class="detail" aria-live="polite"><h2>' + esc(x.name) + '</h2>';
  h += '<span class="chip ' + st + '">' + LABEL[st] + (state.released ? ' in Scenario ' + scen : '') + '</span>';
  if (state.released) h += '<p style="margin:10px 0 0;color:var(--muted)">Proposed for closure in: ' + scenText(x).toLowerCase() + '.' + (x.receiving ? ' Students would move to ' + esc(x.receiving) + '.' : '') + '</p>';
  if (x.address) h += '<p style="margin:12px 0 0;color:var(--muted)">' + esc(x.address) + '</p>';
  h += '<div class="facts">';
  h += '<div class="fact"><b>' + (biz == null ? '–' : biz) + '</b><small>businesses within ¼ mile</small></div>';
  h += '<div class="fact"><b>' + (num(x.bizMile) == null ? '–' : num(x.bizMile)) + '</b><small>businesses within 1 mile</small></div>';
  h += '<div class="fact"><b>' + (num(x.independent) == null || !biz ? '–' : Math.round(num(x.independent) / biz * 100) + '%') + '</b><small>locally owned (¼ mile)</small></div>';
  h += '<div class="fact"><b>' + (num(x.surveyed) == null ? '–' : (num(x.expectLoss) == null ? 0 : num(x.expectLoss)) + ' of ' + num(x.surveyed)) + '</b><small>owners surveyed who expect to lose sales</small></div>';
  h += '</div>';
  var mix = [['food','food and drink'],['retail','retail'],['services','services']].filter(function(k){ return num(x[k[0]]) != null; }).map(function(k){ return num(x[k[0]]) + ' ' + k[1]; });
  if (mix.length) h += '<p style="margin:16px 0 0;color:var(--muted)">Within ¼ mile: ' + mix.join(', ') + '.</p>';
  if (biz) {
    var counted = state.schools.filter(function(s){ return num(s.businesses) != null; });
    var rc = rankOf(x, counted);
    var line = '';
    if (stat(x) === 'closing') {
      var closing = counted.filter(function(s){ return stat(s) === 'closing'; });
      var rl = rankOf(x, closing);
      line = 'Ranks ' + rankText(rl) + ' of the ' + closing.length + ' schools proposed to close in Scenario ' + scen + ', and ' + rankText(rc) + ' of all ' + rc.n + ' schools';
    } else {
      line = 'Ranks ' + rankText(rc) + ' of ' + rc.n + ' schools';
    }
    line += ' for businesses within \u00bc mile';
    if (rc.rank <= 5 && rc.above.length) line += ', behind only ' + names(rc.above);
    if (rc.ties.length) line += ' (tied with ' + names(rc.ties) + ')';
    if (counted.length > 5) h += '<p style="margin:10px 0 0;color:var(--muted)">' + esc(line) + '.</p>';
  }
  if (x.story) h += '<p class="story">' + esc(x.story) + '</p>';
  if (biz == null) h += '<p class="empty" style="margin-top:18px">Data for this school hasn\u2019t been added yet.</p>';
  return h + '</div>';
}

function rankOf(x, pool){
  var b = num(x.businesses);
  var above = pool.filter(function(s){ return num(s.businesses) > b; });
  var ties = pool.filter(function(s){ return s.id !== x.id && num(s.businesses) === b; });
  return { rank: 1 + above.length, above: above, ties: ties, n: pool.length };
}
function rankText(r){ return (r.ties.length ? 'tied for #' : '#') + r.rank; }
function names(list){ var a = list.map(function(s){ return s.name; }); return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
/* ---------- ranked closures ---------- */
function rankHtml(){
  var g = state.schools.filter(function(x){ return stat(x) === 'closing'; });
  if (!g.length) return '';
  var withData = g.filter(function(x){ return num(x.businesses) != null; });
  if (!withData.length) return '<div class="placeholder"><p style="margin:0;color:var(--muted)">Business counts for these schools haven\u2019t been added yet.</p></div>';
  withData.sort(function(a, b){ return num(b.businesses) - num(a.businesses); });
  var max = Math.max.apply(null, withData.map(function(x){ return num(x.businesses); })) || 1;
  var total = withData.reduce(function(s, x){ return s + num(x.businesses); }, 0);
  var busy = withData.filter(function(x){ return num(x.businesses) >= 50; }).length;
  var h = '<p class="sub" style="font-size:1.15rem;color:var(--ink);margin-top:18px"><strong>' + total + ' businesses</strong> sit within a quarter mile of the schools proposed to close in Scenario ' + scen + '. ' + (busy ? busy + ' of those schools anchor a business district; ' + (withData.length - busy) + ' are in mostly residential areas.' : '') + '</p>';
  var top = withData[0], all = state.schools.filter(function(s){ return num(s.businesses) != null; });
  if (top && num(top.businesses) > 0 && (withData.length < 2 || num(withData[1].businesses) < num(top.businesses))) {
    var tr = rankOf(top, all);
    var s2 = esc(top.name) + ' has more businesses nearby than any other school proposed to close. Across all ' + tr.n + ' schools we counted, it ranks ' + rankText(tr);
    if (tr.above.length) s2 += ', second only to ' + esc(names(tr.above));
    if (tr.ties.length) s2 += ' (tied with ' + esc(names(tr.ties)) + ')';
    h += '<p class="sub" style="margin-top:8px">' + s2 + '.</p>';
  }
  h += '<div class="rank">';
  withData.forEach(function(x){
    var b = num(x.businesses), ind = num(x.independent);
    var val = b ? '<b>' + b + '</b> businesses' + (ind != null ? ', ' + Math.round(ind / b * 100) + '% locally owned' : '') : 'No businesses within \u00bc mile';
    h += '<button class="rrow' + (b ? '' : ' zero') + '" data-id="' + esc(x.id) + '"><span class="rname">' + esc(x.name) + '</span><span class="rtrack"><span class="rfill" style="width:' + (b ? Math.max(1, b / max * 65) : 0) + '%"></span><span class="rval">' + val + '</span></span></button>';
  });
  h += '</div>';
  var missing = g.length - withData.length;
  h += '<p class="rnote">Businesses within a quarter mile (about a 5-minute walk) of each school. Select a school for details.' + (missing ? ' ' + missing + ' school' + (missing > 1 ? 's' : '') + ' not yet counted.' : '') + '</p>';
  return h;
}

/* ---------- table ---------- */
function tableHtml(){
  var counts = { all: state.schools.length, closing: 0, open: 0, unlisted: 0 };
  state.schools.forEach(function(x){ counts[stat(x)]++; });
  var f = '<div class="filters" role="group" aria-label="Filter schools">';
  [['all','All schools'],['closing','Proposed to close'],['open','Staying open'],['unlisted','Not yet announced']].filter(function(o){ return !(state.released && o[0] === 'unlisted'); }).forEach(function(o){
    f += '<button data-filter="' + o[0] + '" aria-pressed="' + (filter === o[0]) + '">' + o[1] + ' (' + counts[o[0]] + ')</button>';
  });
  f += '</div>';
  var rows = state.schools.filter(function(x){ return filter === 'all' || stat(x) === filter; })
    .slice().sort(function(a, b){ return (b.scenarios || []).length - (a.scenarios || []).length || a.name.localeCompare(b.name); });
  var t = '<div class="tablebox"><table><thead><tr><th>School</th><th>Status in Scenario ' + scen + '</th>' + (state.released ? '<th>Closes under</th>' : '') + '<th class="n">Within ¼ mi</th><th class="n">Within 1 mi</th></tr></thead><tbody>';
  rows.forEach(function(x){
    var st = stat(x);
    t += '<tr data-id="' + esc(x.id) + '" tabindex="0"><td><strong>' + esc(x.name) + '</strong></td><td><span class="sw ' + st + '" style="vertical-align:-1px;margin-right:6px"></span>' + LABEL[st] + '</td>' + (state.released ? '<td>' + ((x.scenarios || []).length ? scenText(x) : '–') + '</td>' : '') +
      '<td class="n">' + (num(x.businesses) == null ? '–' : num(x.businesses)) + '</td><td class="n">' + (num(x.bizMile) == null ? '–' : num(x.bizMile)) + '</td></tr>';
  });
  if (!rows.length) t += '<tr><td colspan="5" class="empty">No schools in this group yet.</td></tr>';
  return f + t + '</tbody></table></div>';
}

/* ---------- editor (owner only) ---------- */
var FIELDS = [['name','School','text'],['scenarios','Closes in','scen'],['receiving','Students move to','text'],['businesses','Businesses ¼ mi','number'],['independent','Locally owned ¼ mi','number'],['food','Food & drink','number'],['retail','Retail','number'],['services','Services','number'],['bizMile','Businesses 1 mi','number'],['surveyed','Owners surveyed','number'],['expectLoss','Expect lost sales','number'],['address','Address','text'],['lat','Lat','number'],['lon','Lon','number'],['story','Quote or note','text']];
function editorHtml(){

  });
  h += '<div class="tablebox" style="margin-top:10px"><table><thead><tr>';
  FIELDS.forEach(function(f){ h += '<th>' + f[1] + '</th>'; });
  h += '<th></th></tr></thead><tbody>';
  d.schools.forEach(function(x, i){
    h += '<tr>';
    FIELDS.forEach(function(f){
      var v = x[f[0]] == null ? '' : x[f[0]];
      if (f[2] === 'scen') {
        h += '<td style="white-space:nowrap">' + ['A','B'].map(function(o){ return '<label style="font-weight:400;margin-right:8px"><input type="checkbox" style="width:auto" data-sc="' + o + '" data-i="' + i + '"' + ((x.scenarios || []).indexOf(o) >= 0 ? ' checked' : '') + '> ' + o + '</label>'; }).join('') + '</td>';
      } else {
        h += '<td><input data-i="' + i + '" data-k="' + f[0] + '" type="' + (f[2] === 'number' ? 'number' : 'text') + '" step="any" value="' + esc(v) + '" aria-label="' + f[1] + ' for ' + esc(x.name) + '"' + (f[0] === 'story' || f[0] === 'address' || f[0] === 'receiving' ? ' style="min-width:200px"' : '') + '></td>';
      }
    });
    h += '<td><button class="btn" data-del="' + i + '" aria-label="Remove ' + esc(x.name) + '">Remove</button></td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="bar2"><button class="btn" data-act="add">Add a school</button><button class="btn primary" data-act="publish">Publish changes</button><button class="btn" data-act="cancel">Discard changes</button><span class="msg" id="edmsg">' + esc(editMsg) + '</span></div></div>';
  return h;
}

/* ---------- page ---------- */
function render(){
  var keepScroll = window.scrollY;
  var h = '<header class="top"><div class="wrap"><div class="toprow"><h1>' + esc(state.title) + '</h1>';
  if (canEdit) h += '<button class="btn" data-act="edit">' + (editing ? 'Close editor' : 'Edit data') + '</button>';
  h += '</div><p class="lede">' + esc(state.intro) + '</p>';
  if (state.notice) h += '<p class="notice"><i aria-hidden="true"></i><span>' + esc(state.notice) + '</span></p>';
  if (state.released) h += '<div class="filters" role="group" aria-label="Choose a scenario" style="margin-top:20px">' + ['A','B'].map(function(k){ return '<button data-scen="' + k + '" aria-pressed="' + (scen === k) + '">Scenario ' + k + ': ' + scenCount(k) + ' closures</button>'; }).join('') + '</div>';
  if (editing && draft) h += editorHtml();
  h += '</div></header>';
  h += '<main><div class="wrap"><div class="mapgrid"><div class="mapbox">' + mapSvg() +
    '<div class="legend"><span><i class="sw closing"></i>Proposed to close</span><span><i class="sw open"></i>Staying open</span>' + (state.released ? '' : '<span><i class="sw unlisted"></i>Not yet announced</span>') + '<span>Map is schematic; locations are approximate.</span></div></div>' +
    detailHtml() + '</div></div>';
  h += '<section class="band"><div class="wrap"><h2>Some closures would take a business district\u2019s anchor</h2><p class="sub">The schools proposed to close in Scenario ' + scen + ', ranked by how many businesses surround them.</p>' + rankHtml() + '</div></section>';
  h += '<section class="band"><div class="wrap"><h2>Every school we\u2019re tracking</h2><p class="sub">Select a row to see it on the map.</p>' + tableHtml() + '</div></section>';
  h += '<section class="band"><div class="wrap"><h2>How these numbers were gathered</h2><div class="method"><div><h3>Businesses around each school</h3><p>' + esc(state.method) + '</p></div></div></div></section>';
  h += '<footer><div class="wrap">';
  if (state.contact) h += '<p style="color:var(--ink);font-size:1.05rem;white-space:pre-line">' + esc(state.contact) + '</p>';
  if (state.updated) h += '<p>Last updated ' + esc(state.updated) + '.</p>';
  if (state.sources && state.sources.length) {
    h += '<p>Sources</p><ul>' + state.sources.map(function(s){ return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a></li>'; }).join('') + '</ul>';
  }
  h += '</div></footer>';
  root.innerHTML = h;
  window.scrollTo(0, keepScroll);
}

function selectSchool(id, scroll){
  selected = id; render();
  if (scroll) { var m = root.querySelector('.mapgrid'); if (m) m.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
}

root.addEventListener('click', function(e){
  var t = e.target.closest('[data-id],[data-filter],[data-act],[data-del],[data-scen]');
  if (!t) return;
  if (t.hasAttribute('data-scen')) { scen = t.getAttribute('data-scen'); render(); return; }
  if (t.hasAttribute('data-filter')) { filter = t.getAttribute('data-filter'); render(); return; }
  if (t.hasAttribute('data-del')) {
    var i = +t.getAttribute('data-del');
    if (confirm('Remove ' + draft.schools[i].name + ' from the page?')) { draft.schools.splice(i, 1); render(); }
    return;
  }
  if (t.hasAttribute('data-act')) { act(t.getAttribute('data-act'), t); return; }
  if (t.hasAttribute('data-id')) selectSchool(t.getAttribute('data-id'), t.tagName === 'TR');
});
root.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-id]')) { e.preventDefault(); selectSchool(e.target.getAttribute('data-id'), e.target.tagName === 'TR'); }
});
root.addEventListener('input', function(e){
  var t = e.target;
  if (!draft) return;
  if (t.hasAttribute('data-g')) draft[t.getAttribute('data-g')] = t.value;
  if (t.hasAttribute('data-i') && t.hasAttribute('data-k')) {
    var k = t.getAttribute('data-k'), v = t.value;
    if (['businesses','bizMile','independent','food','retail','services','surveyed','expectLoss','lat','lon'].indexOf(k) >= 0) v = v === '' ? null : +v;
    draft.schools[+t.getAttribute('data-i')][k] = v;
  }
});
root.addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('input[data-sc]')) { var x = draft.schools[+t.getAttribute('data-i')], k = t.getAttribute('data-sc'); var s = (x.scenarios || []).filter(function(v){ return v !== k; }); if (t.checked) s.push(k); x.scenarios = s.sort(); }
});

function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || ('school-' + Date.now()); }

async function act(a, el){
  if (a === 'edit') {
    editing = !editing;
    draft = editing ? JSON.parse(JSON.stringify(state)) : null;
    editMsg = ''; render(); return;
  }
  if (a === 'cancel') { editing = false; draft = null; render(); return; }
  if (a === 'add') {
    var name = prompt('School name');
    if (name) { draft.schools.push({ id: slug(name), name: name, scenarios: [], lat: null, lon: null }); render(); }
    return;
  }
  if (a === 'publish') {
    var seen = {};
    draft.schools.forEach(function(x){ if (!x.id || seen[x.id]) x.id = slug(x.name) + '-' + Math.random().toString(36).slice(2, 6); seen[x.id] = 1; });
    var d = new Date();
    draft.updated = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    el.disabled = true; setMsg('Publishing\u2026');
    try { await artifactNs.publish(buildHtml(draft)); setMsg('Published. Reloading\u2026'); }
    catch (err) {
      el.disabled = false;
      var c = err && err.code;
      if (c === 'conflict') setMsg('A newer version was saved elsewhere; the page is reloading to it, so these edits were not saved.');
      else if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'capability_disabled' || c === 'not_declared') { setMsg('This view is read-only, so changes can\u2019t be published from here.'); }
      else if (c === 'rate_limited') setMsg('Publishing too often. Wait a minute, then publish again.');
      else if (c === 'too_large') setMsg('The page is too large to publish. Shorten notes or remove schools.');
      else setMsg('Publishing failed (' + (c || 'unknown error') + '). Your edits are still here; try again.');
    }
  }
}
function setMsg(m){ editMsg = m; var n = document.getElementById('edmsg'); if (n) n.textContent = m; }

function buildHtml(st){
  var json = JSON.stringify(st, null, 1).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    '<title>' + esc(st.title) + '</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">\n' +
    '<style id="s">' + SRC.css + '</style>\n</head>\n<body>\n<div id="root"></div>\n' +
    '<script type="application/json" id="data">' + json + '<\/script>\n' +
    '<script id="app">' + SRC.js + '<\/script>\n</body>\n</html>\n';
}

render();

})();
</script>
</body>
</html>
